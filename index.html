<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4e8">
  <title>用户支持 · 成语入格</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./"><img src="icon.png" alt="" width="44" height="44">成语入格</a>
    </header>
    <h1>用户支持</h1>
    <p class="intro">拖动字卡补全成语，用间隔复习巩固记忆。</p>
    <h2>联系开发者</h2>
    <p>遇到问题或发现词条有误，可以发邮件给 <a href="mailto:codingxm@gmail.com">codingxm@gmail.com</a>。请附上 App 版本和问题出现的步骤。如果是词条问题，写下成语和需要核对的句子即可。</p>
    <h2>如何填字？</h2>
    <p>把底部的字卡拖进棋盘空格。填对后字卡会留在棋盘里。需要一点帮助时，可以点右上角的灯泡。</p>
    <h2>顶部两个数字代表什么？</h2>
    <p>书本数字显示已经学过的成语。勋章数字显示之后的日期复习时独立填对、已经记住的成语。</p>
    <h2>没有网络也能练吗？</h2>
    <p>可以。棋盘、词库和复习安排都在 App 里。重新打开时可以继续上次没填完的棋盘。</p>
    <footer><a href="./">用户支持</a><a href="privacy.html">隐私政策</a></footer>
  </main>
</body>
</html>
